<svg width="1920" height="400" viewBox="0 0 1920 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1920" height="400" fill="#0A1744"/>
  
  <!-- Background pattern -->
  <path d="M0 400L1920 350V400H0Z" fill="#00D4B1" fill-opacity="0.3"/>
  <path d="M0 400L1920 380V400H0Z" fill="#00D4B1" fill-opacity="0.2"/>
  
  <!-- Abstract geometric pattern -->
  <rect x="100" y="50" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="170" y="50" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="240" y="50" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <rect x="100" y="120" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
