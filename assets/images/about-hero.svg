  <path d="M960 50V320" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.1" fill="none"/>
  
  <!-- Small circles representing air sacs -->
  <circle cx="840" cy="100" r="8" fill="#FFFFFF" fill-opacity="0.1"/>
  <circle cx="840" cy="300" r="8" fill="#FFFFFF" fill-opacity="0.1"/>
  <circle cx="1080" cy="100" r="8" fill="#FFFFFF" fill-opacity="0.1"/>
