  <rect x="240" y="120" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <rect x="100" y="190" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="170" y="190" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="240" y="190" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <!-- Pattern on right side -->
  <rect x="1700" y="50" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="1770" y="50" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <rect x="1700" y="120" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="1770" y="120" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <rect x="1700" y="190" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  <rect x="1770" y="190" width="50" height="50" rx="5" fill="#FFFFFF" fill-opacity="0.05"/>
  
  <!-- Lung outlines as a subtle background element -->
  <path d="M960 50C880 100, 800 150, 800 200C800 250, 880 300, 960 320C1040 300, 1120 250, 1120 200C1120 150, 1040 100, 960 50Z" 
