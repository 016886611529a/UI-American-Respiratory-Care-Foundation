<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" fill="#FFFFFF"/>
  
  <!-- Amazon smile logo -->
  <path d="M200 60C160 60, 120 80, 80 120" stroke="#FF9900" stroke-width="6" stroke-linecap="round"/>
  <path d="M200 60C240 60, 280 80, 320 120" stroke="#FF9900" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Amazon text -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#232F3E" text-anchor="middle">amazon</text>
  <text x="290" y="120" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FF9900" text-anchor="middle">smile</text>
  
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="16" fill="#232F3E" text-anchor="middle">You shop. Amazon gives.</text>
</svg> 