<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg" class="respiratory-icon">
  <rect width="500" height="400" rx="20" fill="#F5F9FF"/>
  
  <!-- Abstract lungs design -->
  <path d="M250 100C210 150, 170 200, 170 250C170 300, 210 350, 250 370C290 350, 330 300, 330 250C330 200, 290 150, 250 100Z" 
        stroke="#0A1744" stroke-width="5" fill="none"/>
  
  <!-- Left lung detail -->
  <path d="M250 150C230 180, 210 210, 210 250C210 290, 230 320, 250 340" 
        stroke="#0A1744" stroke-width="3" fill="none"/>
  
  <!-- Right lung detail -->
  <path d="M250 150C270 180, 290 210, 290 250C290 290, 270 320, 250 340" 
        stroke="#0A1744" stroke-width="3" fill="none"/>
  
  <!-- Bronchioles -->
  <path d="M250 100V150" stroke="#0A1744" stroke-width="4" fill="none"/>
  
  <!-- Small branches -->
  <path d="M210 200C190 210, 180 230, 170 250" stroke="#00D4B1" stroke-width="2" fill="none"/>
  <path d="M210 240C200 250, 195 270, 190 290" stroke="#00D4B1" stroke-width="2" fill="none"/>
  <path d="M210 280C220 290, 230 300, 240 310" stroke="#00D4B1" stroke-width="2" fill="none"/>
  
  <path d="M290 200C310 210, 320 230, 330 250" stroke="#00D4B1" stroke-width="2" fill="none"/>
  <path d="M290 240C300 250, 305 270, 310 290" stroke="#00D4B1" stroke-width="2" fill="none"/>
  <path d="M290 280C280 290, 270 300, 260 310" stroke="#00D4B1" stroke-width="2" fill="none"/>
  
  <!-- ARCF Text -->
  <text x="250" y="70" font-family="Playfair Display, serif" font-size="24" font-weight="700" fill="#0A1744" text-anchor="middle">SINCE 1989</text>
  
  <!-- Values circles -->
  <circle cx="150" cy="100" r="30" fill="#00D4B1" fill-opacity="0.2"/>
  <text x="150" y="105" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0A1744" text-anchor="middle">RESEARCH</text>
  
  <circle cx="350" cy="100" r="30" fill="#00D4B1" fill-opacity="0.2"/>
  <text x="350" y="105" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0A1744" text-anchor="middle">EDUCATION</text>
  
  <circle cx="150" cy="350" r="30" fill="#00D4B1" fill-opacity="0.2"/>
  <text x="150" y="355" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0A1744" text-anchor="middle">CARE</text>
  
  <circle cx="350" cy="350" r="30" fill="#00D4B1" fill-opacity="0.2"/>
  <text x="350" y="355" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0A1744" text-anchor="middle">SUPPORT</text>
</svg> 